<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Factory</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            margin-bottom: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-align: center;
        }

        .subtitle {
            color: #666;
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .form-group {
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .status-container {
            display: none;
            margin-top: 30px;
        }

        .status-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .status-title {
            font-size: 1.3em;
            color: #333;
            font-weight: 600;
        }

        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
        }

        .status-pending { background: #fff3cd; color: #856404; }
        .status-generating { background: #d1ecf1; color: #0c5460; }
        .status-deployed { background: #d4edda; color: #155724; }
        .status-failed { background: #f8d7da; color: #721c24; }

        .steps {
            list-style: none;
        }

        .step {
            display: flex;
            align-items: flex-start;
            padding: 15px 0;
            border-bottom: 1px solid #eee;
        }

        .step:last-child {
            border-bottom: none;
        }

        .step-icon {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            flex-shrink: 0;
            font-size: 16px;
        }

        .step-icon.pending { background: #fff3cd; }
        .step-icon.running { background: #d1ecf1; }
        .step-icon.completed { background: #d4edda; }
        .step-icon.failed { background: #f8d7da; }

        .step-content {
            flex: 1;
        }

        .step-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }

        .step-message {
            color: #666;
            font-size: 14px;
        }

        .result-links {
            margin-top: 25px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .result-link {
            display: block;
            padding: 12px;
            margin-bottom: 10px;
            background: white;
            border-radius: 8px;
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
        }

        .result-link:hover {
            background: #667eea;
            color: white;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .feature {
            text-align: center;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 10px;
        }

        .feature-icon {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .feature-title {
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .feature-desc {
            color: #666;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px;
            }
            
            h1 {
                font-size: 1.8em;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🤖 AI Code Factory</h1>
            <p class="subtitle">Превращаем идеи в работающие приложения за минуты</p>

            <div id="ideaForm">
                <div class="form-group">
                    <label for="ideaInput">Опиши идею своего приложения:</label>
                    <textarea 
                        id="ideaInput" 
                        placeholder="Например: Система управления задачами с Telegram-ботом и веб-интерфейсом. Пользователь отправляет задачу боту, AI анализирует и определяет приоритет, задача сохраняется в базу и отображается в веб-интерфейсе..."
                    ></textarea>
                </div>
                <button id="submitBtn" onclick="startProject()">
                    🚀 Создать приложение
                </button>
            </div>

            <div id="statusContainer" class="status-container">
                <div class="status-header">
                    <span class="status-title">Статус создания проекта</span>
                    <span id="statusBadge" class="status-badge status-pending">Ожидание</span>
                </div>

                <ul id="stepsList" class="steps">
                    <!-- Шаги будут добавлены здесь -->
                </ul>

                <div id="resultLinks" class="result-links" style="display: none;">
                    <!-- Ссылки на результат -->
                </div>
            </div>
        </div>

        <div class="features">
            <div class="feature">
                <div class="feature-icon">💡</div>
                <div class="feature-title">Идея</div>
                <div class="feature-desc">Опиши свою идею приложения</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🤖</div>
                <div class="feature-title">AI Генерация</div>
                <div class="feature-desc">AI создаст полный код проекта</div>
            </div>
            <div class="feature">
                <div class="feature-icon">☁️</div>
                <div class="feature-title">Авто-деплой</div>
                <div class="feature-desc">Развернёт на Render автоматически</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔗</div>
                <div class="feature-title">Магическая ссылка</div>
                <div class="feature-desc">Получи ссылку на 24 часа</div>
            </div>
        </div>
    </div>

    <script>
        let projectId = null;
        let pollingInterval = null;

        async function startProject() {
            const ideaInput = document.getElementById('ideaInput');
            const submitBtn = document.getElementById('submitBtn');
            const idea = ideaInput.value.trim();

            if (!idea) {
                alert('Пожалуйста, опишите идею приложения!');
                return;
            }

            // Блокируем кнопку
            submitBtn.disabled = true;
            submitBtn.textContent = '⏳ Запуск...';

            try {
                const response = await fetch('/api/start-project', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        idea: idea,
                        user_id: 'web_user_' + Date.now()
                    })
                });

                if (!response.ok) {
                    throw new Error('Ошибка при создании проекта');
                }

                const data = await response.json();
                projectId = data.project_id;

                // Показываем контейнер статуса
                document.getElementById('statusContainer').style.display = 'block';
                
                // Начинаем опрос статуса
                pollingInterval = setInterval(checkStatus, 2000);

            } catch (error) {
                alert('Ошибка: ' + error.message);
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Создать приложение';
            }
        }

        async function checkStatus() {
            if (!projectId) return;

            try {
                const response = await fetch(`/api/project/${projectId}`);
                
                if (!response.ok) {
                    throw new Error('Не удалось получить статус');
                }

                const data = await response.json();
                updateStatusUI(data);

                // Если проект завершён или неудачен, останавливаем опрос
                if (data.status === 'deployed' || data.status === 'failed') {
                    clearInterval(pollingInterval);
                }

            } catch (error) {
                console.error('Error checking status:', error);
            }
        }

        function updateStatusUI(data) {
            const statusBadge = document.getElementById('statusBadge');
            const stepsList = document.getElementById('stepsList');
            const resultLinks = document.getElementById('resultLinks');

            // Обновляем бейдж статуса
            const statusMap = {
                'pending': { text: 'Ожидание', class: 'status-pending' },
                'generating': { text: 'Генерация', class: 'status-generating' },
                'deployed': { text: 'Готово!', class: 'status-deployed' },
                'failed': { text: 'Ошибка', class: 'status-failed' },
                'waiting_answers': { text: 'Нужны ответы', class: 'status-pending' }
            };

            const statusInfo = statusMap[data.status] || { text: data.status, class: 'status-pending' };
            statusBadge.textContent = statusInfo.text;
            statusBadge.className = 'status-badge ' + statusInfo.class;

            // Обновляем шаги
            stepsList.innerHTML = '';
            data.steps.forEach(step => {
                const iconMap = {
                    'pending': '⏳',
                    'running': '🔄',
                    'completed': '✅',
                    'failed': '❌'
                };

                const li = document.createElement('li');
                li.className = 'step';
                li.innerHTML = `
                    <div class="step-icon ${step.status}">${iconMap[step.status] || '•'}</div>
                    <div class="step-content">
                        <div class="step-name">${capitalizeFirst(step.name)}</div>
                        <div class="step-message">${step.message || 'Ожидание...'}</div>
                    </div>
                `;
                stepsList.appendChild(li);
            });

            // Показываем ссылки если готово
            if (data.status === 'deployed') {
                resultLinks.style.display = 'block';
                resultLinks.innerHTML = `
                    <h3 style="margin-bottom: 15px; color: #333;">🎉 Приложение готово!</h3>
                    <a href="${data.render_url}" target="_blank" class="result-link">
                        🌐 Открыть веб-интерфейс
                    </a>
                    <a href="${data.github_url}" target="_blank" class="result-link">
                        📦 Посмотреть код на GitHub
                    </a>
                    <div style="margin-top: 15px; padding: 10px; background: #e7f3ff; border-radius: 8px; font-size: 14px;">
                        🔮 Магическая ссылка: <code style="background: white; padding: 4px 8px; border-radius: 4px;">${window.location.origin}${data.magic_link}</code>
                        <br><small>Действует 24 часа</small>
                    </div>
                `;

                // Разблокируем кнопку для нового проекта
                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Создать ещё одно приложение';
            } else if (data.status === 'failed') {
                resultLinks.style.display = 'block';
                resultLinks.innerHTML = `
                    <h3 style="margin-bottom: 15px; color: #721c24;">❌ Что-то пошло не так</h3>
                    <p style="color: #666; margin-bottom: 15px;">Попробуйте другую идею или обратитесь к администратору.</p>
                `;

                const submitBtn = document.getElementById('submitBtn');
                submitBtn.disabled = false;
                submitBtn.textContent = '🚀 Попробовать снова';
            }
        }

        function capitalizeFirst(string) {
            return string.charAt(0).toUpperCase() + string.slice(1);
        }
    </script>
</body>
</html>
